[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insider-scanner"
version = "0.4.0"
description = "Scan insider trades from secform4.com, openinsider.com, SEC EDGAR, and European regulators (UK/DE/FR/NL)."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Insider-Scanner Contributors"}]

dependencies = [
    "curl-cffi>=0.14",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "pandas>=3.0.0",
    "PySide6>=6.6",
    "pyyaml>=6.0",
    "pdfplumber>=0.11",
    "numpy>=2.4.1",
    "platformdirs>=4.0",
    "SQLAlchemy>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-qt>=4.2",
    "responses>=0.24",
    "ruff>=0.15.0",
    "setuptools>=68.0",
    "wheel",
]

[project.scripts]
insider-scanner = "insider_scanner.main:main"
insider-scanner-cli = "insider_scanner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"insider_scanner.resources.seeds" = ["*.json", "*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "live: marks tests that require internet (deselect with '-m \"not live\"')",
]
