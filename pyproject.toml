[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insider-scanner"
version = "1.0.0"
description = "Scan insider trades (USA, US Congress, EU) with a local SQLite store and price-timeline overlay; CLI + desktop GUI."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Łukasz Rafał Czarnacki" }]
keywords = [
    "insider-trading",
    "sec",
    "edgar",
    "congress",
    "finance",
    "stocks",
    "pyside6",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "curl-cffi>=0.14,<1",
    "requests>=2.31,<3",
    "beautifulsoup4>=4.12,<5",
    "lxml>=4.9,<7",
    "pandas>=3.0.0,<4",
    "pyyaml>=6.0,<7",
    "pdfplumber~=0.11",
    "cryptography>=48.0.1,<49",
    "numpy>=2.4.1,<3",
    "platformdirs>=4.0,<5",
    "SQLAlchemy>=2.0,<3.0",
]

[project.urls]
Homepage = "https://github.com/Czarnak/insider-scanner"
Repository = "https://github.com/Czarnak/insider-scanner"
Issues = "https://github.com/Czarnak/insider-scanner/issues"

[project.optional-dependencies]
gui = ["pyqtgraph>=0.13,<0.14", "PySide6>=6.6,<7"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-qt>=4.2",
    "responses>=0.24",
    "ruff>=0.15.0",
    "mypy>=1.10,<2",
    "build>=1.2",
    "wheel",
    "setuptools>=68.0",
    "pip-audit>=2.0",
]
release = ["build>=1.2", "twine>=5.1"]

[project.scripts]
insider-scanner = "insider_scanner.main:main"
insider-scanner-cli = "insider_scanner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"insider_scanner.resources.seeds" = ["*.json", "*.txt"]
"insider_scanner.resources.fonts" = ["*.ttf", "*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "live: marks tests that require internet (deselect with '-m \"not live\"')",
]
