name: release

on:
    push:
        tags:
            - "v*.*.*"

permissions:
    contents: read

jobs:
    build:
        name: Build sdist + wheel
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
            - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
              with:
                  python-version: "3.12"
            - run: python -m pip install --upgrade pip build twine
            - run: rm -rf build dist
            - run: python -m build
            - run: python -m twine check dist/*
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: dist
                  path: dist/

    smoke-test:
        name: Install-verify (py ${{ matrix.python }} / ${{ matrix.os }})
        needs: build
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
                python: ["3.11", "3.12", "3.13", "3.14"]
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
            - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
              with:
                  python-version: ${{ matrix.python }}
            - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  name: dist
                  path: dist
            - name: Verify base wheel installation
              shell: bash
              run: |
                  python -m pip install dist/*.whl
                  python scripts/verify_install.py --mode base
            - name: Verify GUI wheel installation
              shell: bash
              env:
                  QT_QPA_PLATFORM: offscreen
              run: |
                  wheel_uri="$(python -c "from pathlib import Path; print(next(Path('dist').glob('*.whl')).resolve().as_uri())")"
                  python -m pip install "insider-scanner[gui] @ ${wheel_uri}"
                  python scripts/verify_install.py --mode gui

    sdist-smoke-test:
        name: Install-verify sdist
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
            - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
              with:
                  python-version: "3.12"
            - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  name: dist
                  path: dist
            - name: Verify base and GUI sdist installations
              env:
                  QT_QPA_PLATFORM: offscreen
              run: |
                  python -m pip install dist/*.tar.gz
                  python scripts/verify_install.py --mode base
                  sdist_uri="$(python -c "from pathlib import Path; print(next(Path('dist').glob('*.tar.gz')).resolve().as_uri())")"
                  python -m pip install "insider-scanner[gui] @ ${sdist_uri}"
                  python scripts/verify_install.py --mode gui

    publish-testpypi:
        name: Publish to TestPyPI
        needs: [smoke-test, sdist-smoke-test]
        runs-on: ubuntu-latest
        environment: testpypi
        permissions:
            id-token: write # OIDC for Trusted Publishing
        steps:
            - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  name: dist
                  path: dist
            - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
              with:
                  repository-url: https://test.pypi.org/legacy/

    verify-testpypi:
        name: Verify install from TestPyPI
        needs: publish-testpypi
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
            - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
              with:
                  python-version: "3.12"
            - name: Wait for TestPyPI to index, then install
              env:
                  QT_QPA_PLATFORM: offscreen
                  VERSION: ${{ github.ref_name }}
              run: |
                  ver="${VERSION#v}"
                  for attempt in 1 2 3 4 5 6; do
                    if python -m pip install \
                      --index-url https://test.pypi.org/simple/ \
                      --extra-index-url https://pypi.org/simple/ \
                      "insider-scanner[gui]==${ver}"; then
                      python scripts/verify_install.py --mode gui
                      exit 0
                    fi
                    sleep $((attempt * 10))
                  done
                  exit 1

    publish-pypi:
        name: Publish to PyPI
        needs: verify-testpypi
        runs-on: ubuntu-latest
        environment: pypi
        permissions:
            id-token: write # OIDC for Trusted Publishing
        steps:
            - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  name: dist
                  path: dist
            - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
