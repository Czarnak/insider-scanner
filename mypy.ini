[mypy]
python_version = 3.11
files = src/insider_scanner
check_untyped_defs = True
show_error_codes = True

# Third-party libraries without typing metadata. Keep imports typed everywhere
# else so a missing project module or a newly missing dependency still fails.
[mypy-pandas,pandas.*,pyqtgraph,pyqtgraph.*]
ignore_missing_imports = True

# debt: Baseline 95 existing diagnostics across 27 explicitly named modules.
# Only the observed error categories below are suppressed; all other categories
# and all unlisted/new modules remain checked, including untyped function bodies.
# Ceiling: a new error of the same category in a listed module is also hidden.
# Revisit each module when its owning PR in docs/review/PR_GROUPS_2026-11-14.md
# lands: fix its typing and remove its suppression. Do not add wildcard modules
# or categories merely to get CI green.

